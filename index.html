<!DOCTYPE html>
<html>
<head>
    <title>CC Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
        }

        .product {
            max-width: 420px;
            margin: 20px auto;
            padding: 30px;
            border: 1px solid #8d7620;
            text-align: center;
            background: #0d0d0d;
        }

        .product h3 {
            font-size: 28px;
        }

        .price {
            font-size: 28px;
            margin: 25px 0;
            color: #d4af37;
        }

        .button {
            display: inline-block;
            background: #d4af37;
            color: black;
            padding: 16px 45px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head
