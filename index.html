<title>Premium Cards PK - 10 Countries</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);padding:15px 20px;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:22px;font-weight:800;color:#FFD700}
.wallet{display:flex;gap:10px;align-items:center;background:#222;padding:8px 14px;border-radius:30px;border:1px solid #333}
.bal{color:#FFD700;font-weight:700}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.search-bar{padding:20px;display:flex;gap:10px}
.search-bar input{flex:1;padding:12px 15px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff}
.filter{padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
.f-btn{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer}
.f-btn.active{background:#FFD700;color:#000;border-color:#FFD700;font-weight:700}
.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:linear-gradient(145deg,#1e1e1e,#151515);border:1px solid #2a2a2a;border-radius:16px;padding:16px}
.card:hover{border-color:#FFD700;transform:translateY(-3px)}
.c-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.flag{font-size:28px}
.brand{font-size:12px;background:#FFD700;color:#000;padding:3px 8px;border-radius:5px;font-weight:800}
.c-country{font-weight:700;font-size:16px}
.c-type{font-size:12px;color:#aaa;margin-bottom:10px}
.c-price{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.price{font-size:22px;font-weight:800;color:#FFD700}
.buy{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border:none;padding:8px 18px;border-radius:8px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:200;padding:15px}
.modal.active{display:flex}
.m-box{background:#1a1a1a;border:1px solid #FFD700;border-radius:16px;padding:20px;width:100%;max-width:380px}
.m-box h3{color:#FFD700;margin-bottom:10px;text-align:center}
.m-box input{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
.ubl{background:#111;border:1px dashed #FFD700;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}
.pay-btn{width:100%;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border:none;padding:12px;border-radius:8px;font-weight:800;margin-top:10px;cursor:pointer}
.close{width:100%;background:#222;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="logo">PREMIUM CARDS PK</div>
<div class="wallet">Balance: <span class="bal" id="balance">$0</span> <button class="btn-gold" onclick="openAddFunds()">Add Funds</button></div>
</div>
<div class="search-bar"><input type="text" id="search" placeholder="Search..." onkeyup="render()"></div>
<div class="filter" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="buyModal"><div class="m-box"><h3 id="buyTitle">Buy Card</h3><p style="font-size:13px;color:#aaa;text-align:center" id="buyInfo"></p><div class="ubl"><b>UBL Bank:</b> 1224390615808<br><b>Title:</b> Abdul Rehman<br><b>Amount:</b> <span id="payAmount" style="color:#FFD700"></span></div><input type="text" id="trx" placeholder="Transaction ID"><input type="email" id="email" placeholder="Your Gmail"><input type="file"><button class="pay-btn" onclick="confirmPay()">Confirm</button><button class="close" onclick="closeModal('buyModal')">Cancel</button></div></div>
<div class="modal" id="fundsModal"><div class="m-box"><h3>Add Funds</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0"><button class="btn-gold" onclick="setFund(10)">$10</button><button class="btn-gold" onclick="setFund(20)">$20</button><button class="btn-gold" onclick="setFund(30)">$30</button><button class="btn-gold" onclick="setFund(50)">$50</button><button class="btn-gold" onclick="setFund(100)">$100</button><input type="number" id="customFund" placeholder="Custom"></div><div class="ubl"><b>UBL:</b> 1224390615808 - Abdul Rehman<br><b>Selected:</b> <span id="fundAmount" style="color:#FFD700">$0</span></div><input type="text" id="f_trx" placeholder="Transaction ID"><input type="email" id="f_email" placeholder="Your Gmail"><button class="pay-btn" onclick="confirmFund()">Confirm</button><button class="close" onclick="closeModal('fundsModal')">Close</button></div></div>
<script>
const cards=[
{cc:"US",flag:"🇺🇸",name:"USA",type:"GOLD Prepaid Card",price:15},
{cc:"US",flag:"🇺🇸",name:"USA",type:"PLATINUM Prepaid Card",price:25},
{cc:"GB",flag:"🇬🇧",name:"UK",type:"WORLD Prepaid Card",price:20},
{cc:"GB",flag:"🇬🇧",name:"UK",type:"WORLD ELITE Prepaid Card",price:35},
{cc:"SA",flag:"🇸🇦",name:"Saudi Arabia",type:"GOLD Prepaid Card",price:15},
{cc:"SA",flag:"🇸🇦",name:"Saudi Arabia",type:"PLATINUM Prepaid Card",price:30},
{cc:"AE",flag:"🇦🇪",name:"UAE - Dubai",type:"GOLD Prepaid Card",price:15},
{cc:"AE",flag:"🇦🇪",name:"UAE - Dubai",type:"WORLD ELITE Prepaid Card",price:50},
{cc:"PK",flag:"🇵🇰",name:"Pakistan",type:"CLASSIC Prepaid Card",price:10},
{cc:"PK",flag:"🇵🇰",name:"Pakistan",type:"GOLD Prepaid Card",price:20},
{cc:"CA",flag:"🇨🇦",name:"Canada",type:"GOLD Prepaid Card",price:20},
{cc:"CA",flag:"🇨🇦",name:"Canada",type:"PLATINUM Prepaid Card",price:35},
{cc:"DE",flag:"🇩🇪",name:"Germany",type:"GOLD Prepaid Card",price:20},
{cc:"DE",flag:"🇩🇪",name:"Germany",type:"WORLD Prepaid Card",price:40},
{cc:"TR",flag:"🇹🇷",name:"Turkey",type:"GOLD Prepaid Card",price:15},
{cc:"TR",flag:"🇹🇷",name:"Turkey",type:"PLATINUM Prepaid Card",price:25},
{cc:"QA",flag:"🇶🇦",name:"Qatar",type:"GOLD Prepaid Card",price:15},
{cc:"QA",flag:"🇶🇦",name:"Qatar",type:"PLATINUM Prepaid Card",price:30},
{cc:"KW",flag:"🇰🇼",name:"Kuwait",type:"GOLD Prepaid Card",price:15},
{cc:"KW",flag:"🇰🇼",name:"Kuwait",type:"WORLD ELITE Prepaid Card",price:45},
];
let bal=parseInt(localStorage.getItem('bal')||0);
let selectedFund=0,selectedCard=null,activeCC="ALL";
document.getElementById('balance').innerText='$'+bal;
function initFilters(){
const uniq=[...new Set(cards.map(c=>c.cc))];
document.getElementById('filters').innerHTML='<button class="f-btn active" onclick="setCountry(\'ALL\',this)">ALL</button>'+uniq.map(cc=>`<button class="f-btn" onclick="setCountry('${cc}',this)">${cc}</button>`).join('');
}
function setCountry(cc,el){activeCC=cc;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
const q=document.getElementById('search').value.toLowerCase();
let list=cards.filter(c=>{
if(activeCC!=="ALL"&&c.cc!==activeCC)return false;
if(q&&!(c.name.toLowerCase().includes(q)||c.type.toLowerCase().includes(q)))return false;
return true;
});
document.getElementById('grid').innerHTML=list.map(c=>`<div class="card"><div class="c-top"><span class="flag">${c.flag}</span><span class="brand">PREPAID</span></div><div class="c-country">${c.name}</div><div class="c-type">${c.type}</div><div class="c-price"><span class="price">$${c.price}</span><button class="buy" onclick="buyCard('${c.cc}','${c.name}','${c.type}',${c.price})">BUY NOW</button></div></div>`).join('');
}
function buyCard(cc,name,type,price){selectedCard={cc,name,type,price};document.getElementById('buyTitle').innerText=name+' - '+type;document.getElementById('payAmount').innerText='$'+price;document.getElementById('buyModal').classList.add('active');}
function openAddFunds(){document.getElementById('fundsModal').classList.add('active');}
function setFund(v){selectedFund=v;document.getElementById('fundAmount').innerText='$'+v;document.getElementById('customFund').value=v;}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function confirmPay(){
const trx=document.getElementById('trx').value;
const email=document.getElementById('email').value;
if(!trx||!email){alert('Enter details');return;}
if(bal<selectedCard.price){alert('Insufficient! Add Funds. Bal: $'+bal);return;}
bal-=selectedCard.price;localStorage.setItem('bal',bal);document.getElementById('balance').innerText='$'+bal;
alert('Order submitted for '+selectedCard.name);closeModal('buyModal');
}
function confirmFund(){
let v=parseInt(document.getElementById('customFund').value||selectedFund);
if(!v)return alert('Select amount');
bal+=v;localStorage.setItem('bal',bal);document.getElementById('balance').innerText='$'+bal;
alert('Funds $'+v+' added (demo)');closeModal('fundsModal');
}
initFilters();render();
</script>
</body>
</html>
