<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREMIUM VIRTUAL CARDS - WORLDWIDE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a1026;color:#fff}
.header{background:#070b18;padding:14px 10px;text-align:center;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:99}

.wrap{overflow-x:auto}
.row{width:100%;min-width:700px;display:grid;grid-template-columns:120px 80px 80px 60px 110px;align-items:center;padding:14px 10px;border-bottom:1px solid #1a2747;background:#101a36}

.cart{background:#1a2747;border:1px solid #2a3a66;color:#fff;padding:10px;border-radius:8px;font-size:18px}
.buy{background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:800;font-size:13px}
.type{font-size:12px}.type b{display:block;color:#fff}
.badge{font-size:8px;background:#FFD700;color:#000;padding:2px 5px;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:999;padding:12px}
.modal.on{display:flex}
.box{background:#111a33;border:2px solid #FFD700;border-radius:14px;padding:16px;max-width:360px;width:100%}
.box input{width:100%;padding:10px;margin:5px 0;background:#070b18;border:1px solid #333;color:#fff;border-radius:8px}
.ubl{background:#070b18;padding:8px;border-radius:8px;border:1px dashed #FFD700;font-size:12px;margin:6px 0}
</style></head><body>
<div class="header"><h1>PREMIUM VIRTUAL CARDS - WORLDWIDE</h1><p>👉 Swipe Left-Right to see BUY NOW 👈</p></div>
<div class="topbar"><div>Balance: <b id="bal" class="gold">$2</b></div><button class="btn-gold" onclick="openF()">Add Funds</button></div>
<div class="wrap"><div class="list" id="list"></div></div>
<div class="modal" id="buyM"><div class="box"><h3 style="color:#FFD700;text-align:center">Buy Card</h3><p id="sel" style="text-align:center;font-size:13px;margin:6px 0"></p><div class="ubl"><b>UBL:</b> 1224390615808<br><b>Title:</b> Abdul Rehman<br>Amount: <b id="amt" class="gold"></b></div><input id="trx" placeholder="Transaction ID"><input id="gmail" placeholder="Your Gmail"><button class="btn-gold" style="width:100%;padding:12px;margin-top:8px" onclick="pay()">Confirm & WhatsApp</button><button onclick="closeM('buyM')" style="width:100%;padding:8px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;margin-top:6px">Close</button></div></div>
<div class="modal" id="fundM"><div class="box"><h3 style="color:#FFD700;text-align:center">Add Funds</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0"><button class="btn-gold" onclick="setF(2)">$2</button><button class="btn-gold" onclick="setF(10)">$10</button><button class="btn-gold" onclick="setF(20)">$20</button><button class="btn-gold" onclick="setF(30)">$30</button><button class="btn-gold" onclick="setF(40)">$40</button><button class="btn-gold" onclick="setF(50)">$50</button><button class="btn-gold" onclick="setF(100)">$100</button><button class="btn-gold" onclick="setF(200)">$200</button></div><input type="number" id="cFund" placeholder="Custom $"><div class="ubl">Selected: <b id="fAmt" class="gold">$0</b><br>UBL: 1224390615808 Abdul Rehman</div><input id="f_trx" placeholder="Transaction ID"><input id="f_gmail" placeholder="Your Gmail"><button class="btn-gold" style="width:100%;padding:12px" onclick="fund()">Confirm Funds</button><button onclick="closeM('fundM')" style="width:100%;padding:8px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;margin-top:6px">Close</button></div></div>
<script>
const cards=[["US","🇺🇸","USA GOLD Prepaid",20],["US","🇺🇸","USA PLATINUM Prepaid",15],["US","🇺🇸","USA WORLD Prepaid",30],["SA","🇸🇦","Saudi GOLD Prepaid",25],["AE","🇦🇪","UAE GOLD Prepaid",25],["AE","🇦🇪","UAE WORLD Prepaid",30],["PK","🇵🇰","Pakistan GOLD Prepaid",10],["CA","🇨🇦","Canada GOLD Prepaid",20],["DE","🇩🇪","Germany GOLD Prepaid",20],["TR","🇹🇷","Turkey GOLD Prepaid",15],["QA","🇶🇦","Qatar GOLD Prepaid",15],["KW","🇰🇼","Kuwait GOLD Prepaid",15],["BH","🇧🇭","Bahrain GOLD Prepaid",15],["OM","🇴🇲","Oman GOLD Prepaid",15],["MY","🇲🇾","Malaysia GOLD Prepaid",15],["SG","🇸🇬","Singapore GOLD Prepaid",25],["AU","🇦🇺","Australia GOLD Prepaid",20]];
let bal=2,cur="",curPrice=0,fundSel=0;
document.getElementById('bal').innerText='$'+bal;
let h="";cards.forEach(c=>{h+=`<div class="row"><div class="type"><b>${c[2]}</b><span class="badge">PREPAID</span> <span style="color:#00ff87">[Instant]</span></div><div class="flag">${c[1]}</div><div class="price">$${c[3]}</div><div style="text-align:center"><button class="cart">🛒</button></div><div><button class="buy" onclick="openP('${c[2]}',${c[3]})">BUY NOW</button></div></div>`;});
document.getElementById('list').innerHTML=h;
function openP(n,p){cur=n;curPrice=p;document.getElementById('sel').innerText=n;document.getElementById('amt').innerText='$'+p;document.getElementById('buyM').classList.add('on');}
function openF(){document.getElementById('fundM').classList.add('on');}
function closeM(id){document.getElementById(id).classList.remove('on');}
function setF(v){fundSel=v;document.getElementById('fAmt').innerText='$'+v;document.getElementById('cFund').value=v;}
function pay(){let t=document.getElementById('trx').value,g=document.getElementById('gmail').value;if(!t||!g){alert('TRX & Gmail');return;}if(bal<curPrice){alert('Balance low');openF();return;}bal-=curPrice;document.getElementById('bal').innerText='$'+bal;let msg=`ORDER: ${cur}%0ATrx:${t}%0AGmail:${g}`;window.open('https://wa.me/923012896632?text='+msg);closeM('buyM');}
function fund(){let v=parseInt(document.getElementById('cFund').value||fundSel);if(!v){alert('Amount');return;}bal+=v;document.getElementById('bal').innerText='$'+bal;alert('Funds $'+v+' added');closeM('fundM');}
</script></body></html>
